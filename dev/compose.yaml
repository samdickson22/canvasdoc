name: canvasdoc-dev

x-canvas: &canvas
  image: canvasdoc-canvas:local
  env_file: .env
  environment:
    RAILS_ENV: development
    HTTPS_METHOD: noredirect
    VIRTUAL_HOST: localhost
    DISABLE_SPRING: '1'
  volumes:
    - ./canvas-lms:/usr/src/app
    - ./seed.rb:/opt/canvasdoc/seed.rb:ro
    - ./.state:/opt/canvasdoc/state
    - gems:/home/docker/.gem
    - bundler:/home/docker/.bundle
    - node_modules:/usr/src/app/node_modules
    - yarn_cache:/home/docker/.cache/yarn
    - assets:/usr/src/app/public/dist
    - files:/usr/src/app/tmp/files
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *canvas
    build:
      context: ./canvas-lms
      args:
        USER_ID: ${CANVASDOC_UID}
    ports:
      - '127.0.0.1:3210:80'
  jobs:
    <<: *canvas
    command: bundle exec script/delayed_job run
  postgres:
    build: ./canvas-lms/docker-compose/postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  rce:
    image: instructure/canvas-rce-api:latest
    environment:
      VIRTUAL_HOST: localhost
      VIRTUAL_PORT: 80
      HTTP_PROTOCOL_OVERRIDE: ${CANVASDOC_RCE_PROTOCOL:-http}
      PASSENGER_MIN_INSTANCES: 1
      PASSENGER_MAX_POOL_SIZE: 2
      STATSD_HOST: 127.0.0.1
      STATSD_PORT: 8125
      ECOSYSTEM_KEY: ${CANVASDOC_RCE_SECRET}
      ECOSYSTEM_SECRET: ${CANVASDOC_RCE_SECRET}
      CIPHER_PASSWORD: ${CANVASDOC_RCE_CIPHER}
    ports:
      - '127.0.0.1:3212:80'
    init: true
    restart: unless-stopped

volumes:
  postgres:
  gems:
    external: true
    name: canvasdoc-dev_gems
  bundler:
    external: true
    name: canvasdoc-dev_bundler
  node_modules:
  yarn_cache:
  assets:
  files:
